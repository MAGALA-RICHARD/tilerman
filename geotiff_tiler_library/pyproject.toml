[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geotiff-tiler"
version = "0.1.0"
description = "Window-based lossless GeoTIFF tiling with CRS and metadata preservation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GeoTIFF Tiler contributors"}]
dependencies = ["rasterio>=1.3", "numpy>=1.24"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
geotiff-tile = "geotiff_tiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
